name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r service/requirements.txt

      - name: Run tests
        run: python -m pytest

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: service/frontend/package-lock.json

      - name: Install dependencies
        working-directory: service/frontend
        run: npm ci

      - name: Typecheck and build
        working-directory: service/frontend
        run: npm run build

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r service/requirements.txt

      - name: Start the API and smoke test it
        run: |
          set -euo pipefail
          cp .env.example .env
          mkdir -p service/server/data
          (cd service/server && API_STDERR_LOG=true python -m uvicorn main:app --host 127.0.0.1 --port 8000 > "$GITHUB_WORKSPACE/api.log" 2>&1) &
          api_pid=$!
          trap 'kill $api_pid 2>/dev/null || true' EXIT

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "API did not become healthy in time" >&2
            cat api.log >&2 || true
            exit 1
          fi

          ./scripts/smoke.sh http://127.0.0.1:8000

      - name: API log
        if: always()
        run: cat api.log || true

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ai-trader:ci
      - name: Boot the image and probe /api/health
        run: |
          docker run -d --name ai-trader-ci -p 8000:8000 ai-trader:ci
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/api/health; then
              docker rm -f ai-trader-ci
              exit 0
            fi
            sleep 2
          done
          docker logs ai-trader-ci
          docker rm -f ai-trader-ci
          exit 1
